name: Bug report
description: Report a reproducible problem with Mirasonic.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, authentication tokens, signed media URLs, public IP addresses, or `.env` contents.
  - type: input
    id: version
    attributes:
      label: Mirasonic version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Subsonic client and version
      placeholder: Amperfy 1.x on iOS 18
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: Describe the smallest sequence that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive information
      options:
        - label: I removed credentials, tokens, signed URLs, public IP addresses, and `.env` contents.
          required: true
